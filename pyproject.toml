[project]
name = "PythonRootDev"
version = "1.0.0"
description = ""
authors = [{ name = "author", email = "author@email.com" }]
requires-python = ">=3.10,<4"
dependencies = [
    "click>=8.1,<9",
    "arcade>=2.6.17,<3",
    "scipy>=1.11.0,<2",
    "pandas>=2.0.3,<3",
    "numpy>=1.26.1,<2",
    "matplotlib>=3.8.0,<4",
    "pyglet>=2.0.10,<3",
    "pandas-stubs>=2.1.4.231227,<3",
    "pygad>=3.3.1,<4",
    "pylint>=3.3.8,<4",
]

[dependency-groups]
dev = [
    "black>=24.2.0,<25",
    "pylint>=3.0.3,<4",
    "tox>=3.24.5,<4",
    "pytest>=6.2.4,<7",
    "pytest-cov>=2.12.1,<3",
    "Sphinx>=5.0,<6",
    "mypy>=1.8,<2",
    "sphinx-rtd-theme>=1.0.0,<2",
    "sphinx_mdinclude>=0.5.1,<0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["param_est", "src"]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
